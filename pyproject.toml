[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "loopy-agent"
version = "1.0.1"
description = "loopy-agent: 21 Essential AI Concepts in one toolkit — agentic loops, gateway, guardrails, evals, caching, observability, MCP, multi-agent, middleware, plugins, state, safety, cost, drift, skills, verification, audit, streaming, multi-modal, compliance, and explainability."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Dream Pixels Forge" },
]
keywords = [
    "ai",
    "llm",
    "agent",
    "agentic",
    "gateway",
    "guardrails",
    "evals",
    "observability",
    "mcp",
    "cache",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
gateway = ["tenacity>=8.0.0"]
cache = ["diskcache>=5.0.0"]
guardrails = ["regex>=2023.0.0"]
observe = ["rich>=13.0.0"]
# v0.7.10 — voice/realtime transport. ``RealtimeSession`` is in core
# but the WebSocket transport itself is pluggable; this extra provides
# the most common concrete implementation.
voice = ["websockets>=12.0"]
# v1.0.0 — property-based testing for ``VerifiedAgent``. Optional so
# the core install stays tiny; install with
# ``pip install loopy-agent[hypothesis]``.
hypothesis = ["hypothesis>=6.0"]
all = [
    "tenacity>=8.0.0",
    "diskcache>=5.0.0",
    "regex>=2023.0.0",
    "rich>=13.0.0",
    "websockets>=12.0",
    "hypothesis>=6.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
loopy = "loopy.cli:main"

[project.urls]
Homepage = "https://github.com/Dream-Pixels-Forge/loopy-agent"
Repository = "https://github.com/Dream-Pixels-Forge/loopy-agent"
Issues = "https://github.com/Dream-Pixels-Forge/loopy-agent/issues"
PyPI = "https://pypi.org/project/loopy-agent/"

[tool.hatch.build.targets.wheel]
packages = ["loopy"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "PIE", "RET"]
# Test scaffolding noise: pytest fixtures, handler shims, intentional
# unused callbacks. Per-file ignores keep the strict rules enforced
# on production code without drowning tests in false positives.
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG", "E501", "W293"]
"**/__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error",
    # Third-party noise we don't control
    "ignore::DeprecationWarning:pkg_resources",
    "ignore::DeprecationWarning:diskcache.*",
    "ignore::DeprecationWarning:dateutil.*",
]
