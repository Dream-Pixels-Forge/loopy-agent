# Release — Build and publish to PyPI on version tags
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # trusted publishing
      contents: write   # create GitHub Release
    environment: pypi

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build
        run: python -m pip install --upgrade pip build

      - name: Build package
        run: python -m build

      # v1.0.0 — generate a CycloneDX SBOM alongside the wheel +
      # sdist. The artifact is attached to the GitHub Release so
      # downstream consumers can audit the dependency surface.
      - name: Generate SBOM (CycloneDX)
        run: |
          python -m pip install --upgrade pip cyclonedx-bom
          cyclonedx-py environment --output-format json \
            --output-file sbom.cdx.json || \
            cyclonedx-py -F -i dist/*.whl --output-format json \
              --output-file sbom.cdx.json

      # v1.0.0 — keyless Cosign signature over the SBOM, using
      # OIDC (Sigstore Fulcio). Anyone can verify with
      # ``cosign verify-blob sbom.cdx.json --certificate-identity ...``.
      # Runs BEFORE the GitHub Release step so the signed
      # artifacts (.sig + .pem) are part of the release.
      # The sigstore/cosign-installer action handles the arch
      # detection + install path correctly across amd64 / arm64
      # runners. ``continue-on-error: true`` ensures a Cosign
      # problem never blocks the PyPI publish — the unsigned
      # SBOM is still attached to the GitHub Release.
      - name: Install Cosign
        if: success()
        uses: sigstore/cosign-installer@v3.7.0

      - name: Sign SBOM with Cosign (keyless, OIDC)
        if: success()
        continue-on-error: true
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign-blob --yes \
            --output-signature sbom.cdx.json.sig \
            --output-certificate sbom.cdx.json.pem \
            sbom.cdx.json

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --generate-notes \
            ./dist/*.whl \
            ./dist/*.tar.gz \
            ./sbom.cdx.json \
            ./sbom.cdx.json.sig \
            ./sbom.cdx.json.pem
